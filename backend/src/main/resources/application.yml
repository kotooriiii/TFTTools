spring:
  config:
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:tfttools}
    username: ${POSTGRES_USER:tfttools}
    password: ${POSTGRES_PASSWORD:tfttools_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

jwt:
  secret: ${JWT_SECRET:tfttools-local-dev-secret-please-change-me-32bytes-min}
  expiration-ms: 604800000 # 7 days

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

server:
  port: 8080
  error:
    include-message: always

cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "*"

tft:
  communitydragon:
    url: "https://raw.communitydragon.org/latest/cdragon/tft/en_us.json"
    cache:
      duration:
        hours: 1  # Cache for 1 hour
    fallback:
      enabled: true  # Use local resource as fallback if URL fails